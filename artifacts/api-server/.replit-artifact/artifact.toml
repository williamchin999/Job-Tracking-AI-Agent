kind = "api"
previewPath = "/"
title = "Threadline Personal AI Agent"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "uvicorn app.main:app --app-dir . --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "-q", "artifacts/api-server/app"]

[services.production.build.env]
PYTHONDONTWRITEBYTECODE = "1"

[services.production.run]
args = ["uvicorn", "app.main:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/health"
